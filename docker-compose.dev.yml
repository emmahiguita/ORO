services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ecommerce
      MARIADB_USER: ecommerce
      MARIADB_PASSWORD: ecommerce_dev
      MARIADB_ROOT_PASSWORD: root_dev_only
    volumes:
      - devemm_db:/var/lib/mysql
      - ./backend/ecommerce.sql:/docker-entrypoint-initdb.d/001-ecommerce.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html/ecommerce
    environment:
      APP_ENV: development
      APP_SECRET: ${APP_SECRET:-dev-only-change-this-secret-0123456789abcdef}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ecommerce
      DB_USER: ecommerce
      DB_PASS: ecommerce_dev
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DELIVERY_FEE: ${DELIVERY_FEE:-10000}
      CURRENCY: ${CURRENCY:-COP}
      AUTH_TOKEN_TTL_SECONDS: 604800
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}

volumes:
  devemm_db:
